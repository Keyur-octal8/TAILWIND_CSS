<!doctype html>
<html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script
        src="https://cdn.tailwindcss.com?plugins=forms,typography,aspect-ratio,line-clamp,container-queries"></script>

</head>

<body>
    <div class="text-center bg-yellow-500 text-5xl my-10">order</div>

    <div class="mx-auto text-center bg-green-500 text-5xl my-10">order-first</div>



    <div class="h-96 container border-4 border-black bg-gray-400 content-center mx-auto mb-10">
        <div class="justify-center items-center flex gap-4">
            <h1 class="rounded-xl text-center bg-blue-500 w-40 h-40 z-5 border-4">
                <p class="ps-10 py-14 text-3xl">01</p>
            </h1>
            <h1 class="rounded-xl text-center bg-blue-500 w-40 h-40 z-4 border-4">
                <p class="ps-10 py-14 text-3xl">02</p>
            </h1>
            <h1 class="rounded-xl text-center bg-blue-500 w-40 h-40 z-3 border-4">
                <p class="ps-10 py-14 text-3xl">03</p>
            </h1>
            <h1 class="rounded-xl text-center bg-blue-500 order-first w-40 h-40 z-2 border-4">
                <p class="ps-10 py-14 text-3xl">04</p>
            </h1>
            <h1 class="rounded-xl text-center bg-blue-500 w-40 h-40 z-1 border-4">
                <p class="ps-10 py-14 text-3xl">05</p>
            </h1>
        </div>
    </div>

    <div class="mx-auto text-center bg-green-500 text-5xl my-10">order-last</div>



    <div class="h-96 container border-4 border-black bg-gray-400 content-center mx-auto mb-10">
        <div class="justify-center items-center flex gap-4">
            <h1 class="rounded-xl text-center bg-blue-500 order-last w-40 h-40 z-5 border-4">
                <p class="ps-10 py-14 text-3xl">01</p>
            </h1>
            <h1 class="rounded-xl text-center bg-blue-500 w-40 h-40 z-4 border-4">
                <p class="ps-10 py-14 text-3xl">02</p>
            </h1>
            <h1 class="rounded-xl text-center bg-blue-500 w-40 h-40 z-3 border-4">
                <p class="ps-10 py-14 text-3xl">03</p>
            </h1>
            <h1 class="rounded-xl text-center bg-blue-500 w-40 h-40 z-2 border-4">
                <p class="ps-10 py-14 text-3xl">04</p>
            </h1>
            <h1 class="rounded-xl text-center bg-blue-500 w-40 h-40 z-1 border-4">
                <p class="ps-10 py-14 text-3xl">05</p>
            </h1>
        </div>
    </div>

    <div class="mx-auto text-center bg-green-500 text-5xl my-10">order-*</div>



    <div class="h-96 container border-4 border-black bg-gray-400 content-center mx-auto mb-10">
        <div class="justify-center items-center flex gap-4">
            <h1 class="rounded-xl text-center bg-blue-500 order-4 w-40 h-40 z-5 border-4">
                <p class="ps-10 py-14 text-3xl">01</p>
            </h1>
            <h1 class="rounded-xl text-center bg-blue-500 order-5 w-40 h-40 z-4 border-4">
                <p class="ps-10 py-14 text-3xl">02</p>
            </h1>
            <h1 class="rounded-xl text-center bg-blue-500 order-2 w-40 h-40 z-3 border-4">
                <p class="ps-10 py-14 text-3xl">03</p>
            </h1>
            <h1 class="rounded-xl text-center bg-blue-500 order-1 w-40 h-40 z-2 border-4">
                <p class="ps-10 py-14 text-3xl">04</p>
            </h1>
            <h1 class="rounded-xl text-center bg-blue-500 order-3 w-40 h-40 z-1 border-4">
                <p class="ps-10 py-14 text-3xl">05</p>
            </h1>
        </div>
    </div>
</body>

</html>
