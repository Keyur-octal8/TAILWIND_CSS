<!doctype html>
<html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script
        src="https://cdn.tailwindcss.com?plugins=forms,typography,aspect-ratio,line-clamp,container-queries"></script>
</head>

<body>
    <div class="text-center bg-yellow-500 text-5xl my-10">Z-index</div>

    <div class="mx-auto text-center bg-green-500 text-5xl my-10">Basic Usege</div>
    <div class="h-96 container border-4 border-black bg-gray-400 content-center mx-auto mb-10">
        <div class="justify-center items-center flex relative">
            <h1 class="rounded-full text-center bg-red-500 w-40 h-40 z-5 absolute border-4 right-[26rem]">
                <p class="ps-10 py-14 text-3xl">01</p>
            </h1>
            <h1 class="rounded-full text-center bg-red-500 w-40 h-40 z-4 absolute border-4 right-[32rem]">
                <p class="ps-10 py-14 text-3xl">02</p>
            </h1>
            <h1 class="rounded-full text-center bg-red-500 w-40 h-40 z-3 absolute border-4 right-[38rem]">
                <p class="ps-10 py-14 text-3xl">03</p>
            </h1>
            <h1 class="rounded-full text-center bg-red-500 w-40 h-40 z-2 absolute border-4 right-[44rem]">
                <p class="ps-10 py-14 text-3xl">04</p>
            </h1>
            <h1 class="rounded-full text-center bg-red-500 w-40 h-40 z-1 absolute border-4 right-[50rem]">
                <p class="ps-10 py-14 text-3xl">05</p>
            </h1>
        </div>
    </div>

    <div class="mx-auto text-center bg-green-500 text-5xl my-10">Hover</div>
    <div class="h-96 container border-4 border-black bg-gray-400 content-center mx-auto mb-10">
        <div class="justify-center items-center flex relative">
            <h1 class="rounded-full text-center bg-red-500 w-40 h-40 z-5 hover:z-10 hover:bg-blue-400 absolute border-4 right-[26rem]">
                <p class="ps-10 py-14 text-3xl">01</p>
            </h1>
            <h1 class="rounded-full text-center bg-red-500 w-40 h-40 z-4 hover:z-10 hover:bg-blue-400 absolute border-4 right-[32rem]">
                <p class="ps-10 py-14 text-3xl">02</p>
            </h1>
            <h1 class="rounded-full text-center bg-red-500 w-40 h-40 z-3 hover:z-10 hover:bg-blue-400 absolute border-4 right-[38rem]">
                <p class="ps-10 py-14 text-3xl">03</p>
            </h1>
            <h1 class="rounded-full text-center bg-red-500 w-40 h-40 z-2 hover:z-10 hover:bg-blue-400 absolute border-4 right-[44rem]">
                <p class="ps-10 py-14 text-3xl">04</p>
            </h1>
            <h1 class="rounded-full text-center bg-red-500 w-40 h-40 z-1 hover:z-10 hover:bg-blue-400 absolute border-4 right-[50rem]">
                <p class="ps-10 py-14 text-3xl">05</p>
            </h1>
        </div>
    </div>

</body>

</html>
