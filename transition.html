<!doctype html>
<html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script
        src="https://cdn.tailwindcss.com?plugins=forms,typography,aspect-ratio,line-clamp,container-queries"></script>

</head>

<body>
    <div class="text-center bg-yellow-500 text-5xl my-10">Transition Property</div>

    <div class="mx-auto text-center  text-5xl m-10">
        <button class="transition rounded-2xl px-4 py-2 ease-in-out delay-150 bg-blue-500 hover:-translate-y-1 hover:scale-110 hover:bg-violet-500 duration-300">
            Save Changes
          </button>

    </div>
    <div class="text-center bg-yellow-500 text-5xl my-10">Transition Duration</div>

    <div class="mx-auto text-center  text-5xl m-10">
        <button class="transition  rounded-2xl px-4 py-2 duration-500 ease-in-out delay-150 bg-blue-500 hover:-translate-y-1 hover:scale-110 hover:bg-cyan-500 duration-300">
            duration-500
          </button>

    </div>
    <div class="text-center bg-yellow-500 text-5xl my-10">Transition Delay</div>

    <div class="mx-auto text-center  text-5xl m-10">
        <button class="transition  rounded-2xl px-4 py-2 duration-500 ease-in-out delay-150 bg-blue-500 hover:-translate-y-3 hover:scale-110 hover:bg-orange-500 duration-300 ">
            delay-150
          </button>
    </div>
    <div class="text-center bg-yellow-500 text-5xl my-10">Transition Timing Function</div>

    <div class="mx-auto text-center  text-5xl m-10">
        <button class="transition  rounded-2xl px-4 py-2 duration-900 ease-in-out delay-150 bg-blue-500 hover:translate-x-20 hover:scale-10 hover:bg-green-500 duration-300 ">
            ease-in-out
          </button>
    </div>

    <div class="text-center bg-yellow-500 text-5xl my-10">Animation</div>


      <div class="space-y-4 flex justify-around items-center">
        <div class="animate-spin  h-40 w-40 border-8 border-dashed border-blue-500 rounded-full"></div>
        <div class="animate-ping h-20 w-20 bg-red-500 rounded-full"></div>
        <div class="animate-pulse h-20 w-20 bg-yellow-500 rounded-full"></div>
        <div class="animate-bounce h-20 w-20 bg-green-500 rounded-full"></div>
      </div>



</body>

</html>
