<!doctype html>
<html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script
        src="https://cdn.tailwindcss.com?plugins=forms,typography,aspect-ratio,line-clamp,container-queries"></script>

</head>

<body>
    <div class="text-center bg-yellow-500 text-5xl my-10">Display</div>

    <div class="mx-auto text-center bg-green-500 text-5xl m-10">block</div>

    <div class="block">
        This is a block element.
    </div>
    <div class="mx-auto text-center bg-green-500 text-5xl m-10">inline-block</div>

    <span class="inline-block p-4 bg-blue-500 text-white">
        Inline-block element
    </span>
    <div class="mx-auto text-center bg-green-500 text-5xl m-10">inline</div>

    <span class="inline p-2 bg-blue-500 text-white">
        Inline element
    </span>

    <div class="mx-auto text-center bg-green-500 text-5xl m-10">flex</div>

    <div class="flex space-x-4">
        <div class="w-32 h-32 bg-red-500">Item 1</div>
        <div class="w-32 h-32 bg-blue-500">Item 2</div>
    </div>
    <div class="hidden">
        This element is hidden.
    </div>



</body>

</html>
