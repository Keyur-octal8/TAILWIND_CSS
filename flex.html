<!doctype html>
<html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script
        src="https://cdn.tailwindcss.com?plugins=forms,typography,aspect-ratio,line-clamp,container-queries"></script>

</head>

<body>
    <div class="text-center bg-yellow-500 text-5xl my-10">Flex</div>

    <div class="mx-auto text-center bg-green-500 text-5xl m-10">Flex basis</div>

    <div class="mx-auto container flex flex-row gap-5 text-center">
        <div class="p-4 basis-1/3 rounded-xl bg-blue-500 text-white flex-1">01</div>
        <div class="p-4 basis-1/3 rounded-xl bg-blue-500 text-white flex-1">02</div>
        <div class="p-4 basis-1/2 rounded-xl bg-blue-800 text-white flex-1">03</div>
    </div>

    <div class="mx-auto text-center bg-green-500 text-5xl m-10">Flex deriction</div>

    <div class="mx-auto container flex flex-row-reverse gap-5 text-center">
        <div class="p-4 basis-1/3 rounded-xl bg-blue-500 text-white flex-1">01</div>
        <div class="p-4 basis-1/3 rounded-xl bg-blue-500 text-white flex-1">02</div>
        <div class="p-4 basis-1/2 rounded-xl bg-blue-800 text-white flex-1">03</div>
    </div>

    <div class="mx-auto text-center bg-green-500 text-5xl m-10">flex-Col</div>

    <div class="mx-auto max-w-md container flex flex-col gap-5 text-center">
        <div class="p-4 rounded-xl bg-purple-500 text-white flex-1">01</div>
        <div class="p-4 rounded-xl bg-purple-800 text-white flex-1">02</div>
        <div class="p-4 rounded-xl bg-purple-500 text-white flex-1">03</div>
    </div>

    <div class="mx-auto text-center bg-green-500 text-5xl m-10">flex-col-reverse</div>

    <div class="mx-auto max-w-md container flex flex-col-reverse gap-5 text-center">
        <div class="p-4 rounded-xl bg-purple-500 text-white flex-1">01</div>
        <div class="p-4 rounded-xl bg-purple-800 text-white flex-1">02</div>
        <div class="p-4 rounded-xl bg-purple-500 text-white flex-1">03</div>
    </div>

    <div class="mx-auto text-center bg-green-500 text-5xl m-10">flex hover</div>

    <div class="mx-auto max-w-md container flex flex-row hover:flex-col gap-5 text-center">
        <div class="p-4 rounded-xl bg-purple-500 text-white flex-1">01</div>
        <div class="p-4 rounded-xl bg-purple-800 text-white flex-1">02</div>
        <div class="p-4 rounded-xl bg-purple-500 text-white flex-1">03</div>
    </div>

    <div class="mx-auto text-center bg-green-500 text-5xl m-10">flex wrap</div>

    <div class="flex flex-wrap gap-4 p-4 justify-center text-center">
        <div class="rounded-xl py-3 w-96 bg-purple-500 text-white">01</div>
        <div class="rounded-xl py-3 w-96 bg-purple-800 text-white">02</div>
        <div class="rounded-xl py-3 w-96 bg-purple-500 text-white">03</div>   
    </div>

    <div class="mx-auto text-center bg-green-500 text-5xl m-10">flex wrap-reverse</div>

    <div class="flex flex-wrap-reverse gap-4 p-4 justify-center text-center">
        <div class="rounded-xl py-3 w-96 bg-purple-500 text-white">01</div>
        <div class="rounded-xl py-3 w-96 bg-purple-800 text-white">02</div>
        <div class="rounded-xl py-3 w-96 bg-purple-500 text-white">03</div>   
    </div>

    <div class="mx-auto text-center bg-green-500 text-5xl m-10">flex-initial</div>

    <div class="flex flex-initial gap-4 p-4 justify-center text-center">
        <div class="rounded-xl py-3 w-96 bg-purple-500 text-white">01</div>
        <div class="rounded-xl py-3 w-96 bg-purple-800 text-white">02</div>
        <div class="rounded-xl py-3 w-96 bg-purple-500 text-white">03</div>   
    </div>

    <div class="mx-auto text-center bg-green-500 text-5xl m-10">flex-none</div>

    <div class="flex flex-initial gap-4 p-4 justify-center text-center">
        <div class="rounded-xl py-3 w-96 bg-purple-500 text-white">01</div>
        <div class="rounded-xl flex-none py-3 w-96 bg-purple-800 text-white">02</div>
        <div class="rounded-xl py-3 w-96 bg-purple-500 text-white">03</div>   
    </div>

    <div class="mx-auto text-center bg-green-500 text-5xl m-10">grow</div>

    <div class="flex flex-initial gap-4 p-4 justify-center text-center">
        <div class="rounded-xl py-3 w-96 bg-purple-500 text-white">01</div>
        <div class="rounded-xl grow py-3 w-96 bg-purple-800 text-white">02</div>
        <div class="rounded-xl py-3 w-96 bg-purple-500 text-white">03</div>   
    </div>

    <div class="mx-auto text-center bg-green-500 text-5xl m-10">grow-0</div>

    <div class="flex gap-4 p-4 justify-center text-center">
        <div class="rounded-xl grow py-3 w-96 bg-purple-500 text-white">01</div>
        <div class="rounded-xl grow-0 py-3 w-96 bg-purple-800 text-white">02</div>
        <div class="rounded-xl grow py-3 w-96 bg-purple-500 text-white">03</div>   
    </div>

    <div class="mx-auto text-center bg-green-500 text-5xl m-10">shrink</div>

    <div class="flex gap-4 p-4 justify-center text-center">
        <div class="rounded-xl shrink py-3 w-96 bg-purple-500 text-white">01</div>
        <div class="rounded-xl shrink py-3 w-96 bg-purple-800 text-white">02</div>
        <div class="rounded-xl grow py-3 w-96 bg-purple-500 text-white">03</div>   
    </div>
</body>

</html>
