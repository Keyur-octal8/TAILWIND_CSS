<!doctype html>
<html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script
        src="https://cdn.tailwindcss.com?plugins=forms,typography,aspect-ratio,line-clamp,container-queries"></script>

</head>

<body>
    <div class="text-center bg-yellow-500 text-5xl my-10">Transforms</div>
    <div class="text-center bg-green-500 text-5xl my-10">Scale</div>

    <div class="container mx-auto text-center text-5xl">
        <div class="scale-50 bg-blue-500">50%</div>

        <div class="scale-75 bg-blue-500">75%</div>

        <div class="scale-90 bg-blue-500">90%</div>
    </div>

    <div class="text-center bg-green-500 text-5xl my-10">Rotate</div>

    <div class="container mx-auto text-center text-5xl flex gap-40">
        <div class="rotate-45 bg-blue-500 h-20 w-20">45°</div>
        <div class="-rotate-45 bg-blue-500 h-20 w-20">-45°</div>

        <div class="rotate-90 bg-blue-500 h-20 w-20">90°</div>
        <div class="-rotate-90 bg-blue-500 h-20 w-20">-90°</div>

        <div class="rotate-180 bg-blue-500 h-20 w-20">180°</div>
      
    </div>

    <div class="text-center bg-green-500 text-5xl my-10">Translate</div>

    <div class="container mx-auto text-center text-5xl flex gap-40">
        <div class="translate-x-10 bg-blue-500 h-35 w-30">x-10px</div>
   

        <div class="translate-y-10 bg-blue-500 h-35 w-30">y-10px</div>
  

        <div class="translate-x-10 translate-y-10 bg-blue-500 h-35 w-30">x-10px</div>
      
    </div>


        <div class="text-center bg-green-500 text-5xl my-10">Skew</div>

        <div class="container mx-auto text-center text-5xl flex gap-40">
            <div class="skew-x-3 bg-blue-500 h-35 w-30">x-3</div>
            <div class="-skew-x-6 bg-blue-500 h-35 w-30">-x-6</div>
            <div class="skew-y-12 bg-blue-500 h-35 w-30">y-12</div>
            <div class="-skew-y-6 bg-blue-500 h-35 w-30">-y-6</div>
        </div>
        <div class="text-center bg-green-500 text-5xl my-10">Transform Origin</div>

        <div class="container mx-auto text-center text-5xl flex gap-40">
          
            <div class="origin-bottom -rotate-12 bg-blue-500 h-35 w-30">origin-bottom</div>

            <div class="origin-top rotate-12 bg-blue-500 h-35 w-30">origin-top</div>


  

</body>

</html>
