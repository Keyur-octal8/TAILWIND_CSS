<!doctype html>
<html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script
        src="https://cdn.tailwindcss.com?plugins=forms,typography,aspect-ratio,line-clamp,container-queries"></script>
</head>

<body>
    <div class="text-center bg-yellow-500 text-5xl my-10">Object-fit</div>

    <div class="mx-auto text-center bg-green-500 text-5xl m-10">cover</div>
    <div class="h-96 w-96 border-4 border-red-500 mx-auto mb-10">
        <img class="object-cover h-full w-full" src="../images/01.jpeg" alt="cover example">
    </div>

    <div class="mx-auto text-center bg-green-500 text-5xl m-10">contain</div>
    <div class="h-96 w-96 border-4 border-red-500 mx-auto mb-10">
        <img class="object-contain h-full w-full" src="../images/01.jpeg" alt="contain example">
    </div>

    <div class="mx-auto text-center bg-green-500 text-5xl m-10">fill</div>
    <div class="h-96 w-96 border-4 border-red-500 mx-auto mb-10">
        <img class="object-fill h-full w-full" src="../images/01.jpeg" alt="fill example">
    </div>

    <div class="mx-auto text-center bg-green-500 text-5xl m-10">none</div>
    <div class="h-96 w-96 border-4 border-red-500 mx-auto mb-10">
        <img class="object-none h-full w-full" src="../images/01.jpeg" alt="none example">
    </div>

    <div class="mx-auto text-center bg-green-500 text-5xl m-10">scale-down</div>
    <div class="h-96 w-96 border-4 border-red-500 mx-auto mb-10">
        <img class="object-scale-down h-full w-full" src="../images/01.jpeg" alt="scale-down example">
    </div>

    <div class="text-center bg-yellow-500 text-5xl my-10">Object-position</div>

    <div class="mx-auto text-center bg-green-500 text-5xl m-10">object-bottom</div>
    <div class="h-96 max-w-md mx-auto mb-10">
        <img class="object-none object-bottom border-black border-4 w-96 h-96" src="./images/01.jpeg">
    </div>

    <div class="mx-auto text-center bg-green-500 text-5xl m-10">object-center</div>
    <div class="h-96 max-w-md mx-auto mb-10">
        <img class="object-none object-center border-black border-4 w-96 h-96" src="./images/01.jpeg">
    </div>

    <div class="mx-auto text-center bg-green-500 text-5xl m-10">object-left</div>
    <div class="h-96 max-w-md mx-auto mb-10">
        <img class="object-none object-left border-black border-4 w-96 h-96" src="./images/01.jpeg">
    </div>

    <div class="mx-auto text-center bg-green-500 text-5xl m-10">object-left-bottom</div>
    <div class="h-96 max-w-md mx-auto mb-10">
        <img class="object-none object-left-bottom border-black border-4 w-96 h-96" src="./images/01.jpeg">
    </div>

    <div class="mx-auto text-center bg-green-500 text-5xl m-10">object-left-top</div>
    <div class="h-96 max-w-md mx-auto mb-10">
        <img class="object-none object-left-top border-black border-4 w-96 h-96" src="./images/01.jpeg">
    </div>

    <div class="mx-auto text-center bg-green-500 text-5xl m-10">object-right</div>
    <div class="h-96 max-w-md mx-auto mb-10">
        <img class="object-none object-right border-black border-4 w-96 h-96" src="./images/01.jpeg">
    </div>

    <div class="mx-auto text-center bg-green-500 text-5xl m-10">object-right-bottom</div>
    <div class="h-96 max-w-md mx-auto mb-10">
        <img class="object-none object-right-bottom border-black border-4 w-96 h-96" src="./images/01.jpeg">
    </div>

    <div class="mx-auto text-center bg-green-500 text-5xl m-10">object-right-top</div>
    <div class="h-96 max-w-md mx-auto mb-10">
        <img class="object-none object-right-top border-black border-4 w-96 h-96" src="./images/01.jpeg">
    </div>

    <div class="mx-auto text-center bg-green-500 text-5xl m-10">object-top</div>
    <div class="h-96 max-w-md mx-auto mb-10">
        <img class="object-none object-top border-black border-4 w-96 h-96" src="./images/01.jpeg">
    </div>

</body>

</html>
